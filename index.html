<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Бүртгэл | Монгол Улсын Их Сургууль" />
    <title>Бүртгэл | Монгол Улсын Их Сургууль</title>
    <link rel="icon" href="./assets/seal.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css"
      media="all"
    />
    <link rel="stylesheet" href="./style.css" media="all" />
  </head>
  <body>
    <div class="side-bichig side-bichig-left" aria-hidden="true">
      <img src="./assets/bichig-left-top.png" alt="" />
      <img src="./assets/bichig-left-bottom.png" alt="" />
    </div>
    <div class="side-bichig side-bichig-right" aria-hidden="true">
      <img src="./assets/bichig-right-first.png" alt="" />
      <img src="./assets/bichig-right-second.png" alt="" />
    </div>

    <main class="page">
      <div class="ribbon">
        <img class="seal" src="./assets/logo.webp" alt="Монгол Улсын Их Сургуулийн тамга" />
      </div>

      <div class="cards">
        <a class="card" href="https://burtgel.num.edu.mn/bachelor/" aria-label="Бакалаврын элсэлт" id="bachelor">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3Z" fill="#fff" />
              <path d="M5 10.18V15c0 2.21 3.13 4 7 4s7-1.79 7-4v-4.82l-7 3.18-7-3.18Z" fill="#fff" />
            </svg>
          </div>
          <div class="card-book" aria-hidden="true">
            <svg viewBox="0 0 220 120" preserveAspectRatio="none">
              <path d="M0,90 C40,60 90,110 130,80 C170,50 200,90 220,70 L220,120 L0,120 Z" fill="#eaf1fb" />
              <path d="M20,100 C60,75 100,115 140,90 C175,68 205,98 220,85 L220,120 L0,120 Z" fill="#f4f8fd" />
            </svg>
          </div>
          <h3>Бакалаврын өдрийн хөтөлбөрийн элсэлтийн систем</h3>
          <hr />
          <p>Ерөнхий боловсролын сургуулийн төгсөгчид</p>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </a>

        <a class="card" href="https://burtgel.num.edu.mn/negdsen" aria-label="Нэгдсэн систем" id="integrated">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z" fill="#fff" />
              <path d="M14 2v5h5" fill="#003f8c" />
              <circle cx="15.5" cy="15.5" r="3.2" fill="#f5b400" />
              <path d="M14.3 15.6l0.9 0.9 1.9-1.9" stroke="#003f8c" stroke-width="1" fill="none" />
            </svg>
          </div>
          <div class="card-book" aria-hidden="true">
            <svg viewBox="0 0 220 120" preserveAspectRatio="none">
              <path d="M0,90 C40,60 90,110 130,80 C170,50 200,90 220,70 L220,120 L0,120 Z" fill="#eaf1fb" />
              <path d="M20,100 C60,75 100,115 140,90 C175,68 205,98 220,85 L220,120 L0,120 Z" fill="#f4f8fd" />
            </svg>
          </div>
          <h3>Бүртгэлийн нэгдсэн систем</h3>
          <hr />
          <p>
            Доктор, магистр, бакалаврын орой/эчнээ, иргэний сургалт, бакалаврын зэрэгтэй иргэн
            бакалаврын өдрийн хөтөлбөрт элсэх болон шилжих хүсэлт гаргах
          </p>
          <span class="card-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </a>
      </div>
    </main>
  </body>
</html>
